<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cherrier Frères — Logistique des commandes (préversion)</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F5F1; --paper:#FFFFFF; --ink:#1C1D1A; --muted:#5F625A; --line:#E3E1DA;
  --wine:#7A4E2D; --wine-d:#5C3920; --soft:#F3E9DF; --gold:#D9A57A; --green:#1E6B33; --orange:#8A5300; --red:#A3261B;
  --blanc:#e2d48a; --rouge:#7a1f2b; --rose:#e8a3a0;
  --r:10px; --shadow:0 1px 2px rgba(40,20,10,.06),0 4px 14px rgba(40,20,10,.06);
  --serif:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--wine)}
h1,h2,h3{font-family:var(--sans);font-weight:700;letter-spacing:-.01em;margin:0}

/* Barre du haut */
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 24px;background:#fff;color:var(--ink);border-bottom:1px solid var(--line)}
#top .brand{display:flex;align-items:center;gap:10px;min-width:0}
#top .brand b{font-size:17px;white-space:nowrap}
.brandlogo{height:54px;width:auto;display:block}
#top .brand .sep{padding-left:14px;border-left:1px solid var(--line);font-size:13px;color:var(--muted);line-height:1.3}
#top .brand small{font-size:12px;white-space:nowrap}
.logo{width:30px;height:30px;flex:none}
#views{display:flex;gap:4px;margin-left:auto;background:var(--bg);border:1px solid var(--line);padding:4px;border-radius:999px}
#views button{border:0;background:transparent;color:#3D3F3A;padding:7px 14px;border-radius:999px;font-weight:500;white-space:nowrap}
#views button.on{background:var(--wine);color:#fff}
#sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
#sync i{width:9px;height:9px;border-radius:50%;background:#999;display:inline-block}
#sync.ok i{background:#5cc77a;box-shadow:0 0 0 3px rgba(92,199,122,.25)}
#sync.wait i{background:#e2b33c}
#sync.off i{background:#e0605a}
@media (max-width:820px){#top{flex-wrap:wrap;padding:8px 12px}#top .brand small{display:none}#views{order:3;width:100%;margin:0;justify-content:space-between}#views button{flex:1;padding:7px 6px}}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;font-size:12.5px;background:var(--soft);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.15)}
.btn{border:1px solid #CFCCC3;background:var(--paper);padding:9px 16px;border-radius:8px;font-weight:500}
.btn:hover{border-color:#cdbfa8}
.btn.p{background:var(--wine);border-color:var(--wine);color:#fff}
.btn.p:hover{background:var(--wine-d)}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn.s{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical}
input[type=number]{width:90px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.ok{color:var(--green)} .warn{color:var(--orange)} .ko{color:var(--red)}
.vchip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12.5px;font-weight:600}
.vchip.ok{background:#e1f0e4;color:var(--green)} .vchip.tendu{background:#fbecd9;color:var(--orange)} .vchip.rupture{background:#f8dedc;color:var(--red)}

/* ---------- Présentation ---------- */
.pres{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:center;margin-bottom:34px}
.hero h1{font-size:38px;line-height:1.1;color:var(--wine-d)}
.hero .kicker{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--gold);font-weight:700;margin-bottom:10px}
.hero p{font-size:17px;color:#3D3F3A}
.heroimg{display:flex;align-items:flex-end;gap:14px;margin:-18px -18px 16px;padding:18px 22px 0;background:var(--soft);border-radius:var(--r) var(--r) 0 0;overflow:hidden}.heroimg img{height:210px;width:auto;margin-bottom:-6px}.heroimg img.lg{height:auto;width:46%;align-self:center;margin:0 0 20px}.heroimg:empty{display:none}
.tag{display:inline-block;background:#FBEFD9;color:#6E4300;border-radius:6px;padding:3px 9px;font-size:13px;font-weight:600}
.flow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:14px 0 6px}
.flow div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 10px;position:relative;font-size:13.5px}
.flow div b{display:flex;width:26px;height:26px;border-radius:50%;background:var(--wine);color:#fff;align-items:center;justify-content:center;font-size:13px;margin-bottom:8px}
.flow div em{display:block;font-style:normal;color:var(--muted);font-size:12px;margin-top:4px}
.flow div.fa b{background:var(--gold)} .flow div.fb b{background:var(--wine-d)}
@media (max-width:900px){.hero{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}}
.sect{margin-top:38px}
.sect>h2{font-size:24px;margin-bottom:6px;color:var(--wine-d)}
.supports{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px}
@media (max-width:820px){.supports{grid-template-columns:1fr}}
.sup{padding:18px;display:flex;flex-direction:column;gap:10px}
.sup h3{font-size:20px}
.sup .ill{height:118px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.sup ul{margin:0;padding-left:18px;color:#3D3F3A;font-size:14px}
.how{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:14px}
@media (max-width:820px){.how{grid-template-columns:1fr}}
.how ol{margin:0;padding-left:20px}
.how ol li{margin:6px 0}
.share{padding:18px;display:flex;gap:16px;align-items:center}
.share img{width:150px;height:150px;border-radius:6px;background:#fff;flex:none}
.linkbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:#F1F0EC;border-radius:6px;padding:7px 9px;word-break:break-all;margin:8px 0}
.notin{columns:2;font-size:14px;color:#3D3F3A}
@media (max-width:700px){.notin{columns:1}}

/* ---------- Ordinateur ---------- */
.pc{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 54px)}
.side{background:#fff;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:3px}
.side button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:10px 12px;border-radius:8px;text-align:left;font-weight:500}
.side button:hover{background:#EEE5DA}
.side button.on{background:var(--soft);color:var(--wine-d);font-weight:600}
.side .n{margin-left:auto;background:var(--wine);color:#fff;border-radius:999px;font-size:11.5px;padding:1px 7px}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px 10px}
.pcmain{padding:18px 22px;min-width:0}
.pchead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pchead h2{font-size:24px}
@media (max-width:820px){.pc{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto;padding:8px}.side .foot{display:none}.side button{white-space:nowrap}}
.split{display:grid;grid-template-columns:minmax(280px,400px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.list{overflow:hidden}
.li{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 14px}
.li:last-child{border-bottom:0}
.li:hover{background:#FAF8F4}
.li.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--wine)}
.li .l1{display:flex;gap:8px;align-items:center}
.li .l1 b{font-weight:600}
.li .l2{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread b{color:var(--wine)}
.unread .l1::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--wine);flex:none}
.pane{padding:18px 20px;min-width:0}
.pane select{max-width:100%;width:100%}
.mailbody{white-space:pre-wrap;background:#FAF9F6;border:1px solid var(--line);border-radius:8px;padding:14px;font-size:14.5px;margin:12px 0}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid #EEEDE8;vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px}
.filters button.on{background:var(--soft);color:var(--wine-d);border-color:var(--wine);font-weight:600}
.stepper{display:flex;gap:0;margin:14px 0 4px;overflow-x:auto}
.stepper div{flex:1;min-width:92px;font-size:11.5px;color:var(--muted);position:relative;padding-top:16px;text-align:center}
.stepper div::before{content:"";position:absolute;top:5px;left:0;right:0;height:3px;background:var(--line)}
.stepper div::after{content:"";position:absolute;top:0;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.stepper div.done::before,.stepper div.done::after{background:var(--green)}
.stepper div.cur{color:var(--ink);font-weight:600}
.stepper div.cur::after{background:var(--wine);box-shadow:0 0 0 4px rgba(122,78,45,.18)}
.box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:#FAF9F6;margin-top:12px}
.box.alert{background:#fdf0ee;border-color:#efc4be}
.box.warn{background:#fdf5e8;border-color:#efd5ae}
.box h4{margin:0 0 6px;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.hist{font-size:13px;color:var(--muted);margin:0;padding-left:16px}
.bar{height:8px;background:#ECEBE6;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* ---------- Tablette ---------- */
.tab{display:grid;grid-template-columns:340px 1fr;gap:0;min-height:calc(100vh - 54px);background:#EEEDE8}
.tlist{padding:14px;display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--line);overflow:auto}
.tlist h3{font-family:var(--sans);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 4px 0}
.tcard{border:2px solid transparent;background:var(--paper);border-radius:12px;padding:14px;text-align:left;box-shadow:var(--shadow);min-height:64px}
.tcard.on{border-color:var(--wine)}
.tcard .n{font-family:var(--serif);font-size:22px;font-weight:700}
.tcard .c{font-size:16px;font-weight:600}
.tcard .m{font-size:13.5px;color:var(--muted);margin-top:4px}
.tdet{padding:18px 22px;overflow:auto}
.tdet h2{font-size:30px}
.tline{background:var(--paper);border-radius:14px;padding:16px;margin-top:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.tline.done{border-color:#9fcfab;background:#f3faf4}
.tline .top{display:flex;gap:12px;align-items:flex-start}
.tline .nm{font-size:19px;font-weight:700}
.tline .hb{font-size:16px;margin-top:3px}
.tline .q{margin-left:auto;text-align:right;font-size:15px;color:var(--muted)}
.tline .q b{display:block;font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums}
.tsteps{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center}
.tstep{flex:1;min-width:150px;min-height:56px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px}
.tstep.on{background:var(--green);border-color:var(--green);color:#fff}
.cnt{display:flex;align-items:center;gap:8px;font-size:16px}
.cnt button{width:52px;height:52px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:24px;font-weight:700}
.cnt b{min-width:72px;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.consigne{background:#fff5c9;border:1px solid #ecd77a;border-radius:12px;padding:12px 14px;font-size:16px;margin-top:12px}
.tfoot{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.tfoot .btn{min-height:58px;font-size:17px;padding:10px 22px;border-radius:12px}
@media (max-width:860px){.tab{grid-template-columns:1fr}.tlist{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.tlist h3{display:none}.tcard{min-width:220px}}

/* ---------- TV ---------- */
.tv{background:#141512;color:#F5F2EC;min-height:100vh;padding:2.2vh 2.2vw;display:flex;flex-direction:column;gap:2vh;font-size:1.25vw}
.tvhead{display:flex;align-items:center;gap:2vw}
.tvhead h1{font-size:2.3vw;color:#F5F2EC;padding-left:1.4vw;border-left:2px solid #34372F}
.tvlogo{height:4.6vw;width:auto}
.tvhead .sub{color:#B5B2A8;font-size:1.2vw}
.tvclock{margin-left:auto;text-align:right}
.tvclock b{font-size:3.4vw;font-variant-numeric:tabular-nums;font-weight:600;display:block;line-height:1}
.tvclock span{color:#B5B2A8;font-size:1.2vw}
.tvcols{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vw;flex:1;min-height:0}
.tvcol{background:#1A1C18;border-radius:1vw;padding:1.2vw;display:flex;flex-direction:column;gap:1vw;min-height:0;overflow:hidden}
.tvcol h2{font-family:var(--sans);font-size:1.5vw;text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:.8vw}
.tvcol h2 .k{margin-left:auto;background:#2B2E28;border-radius:999px;padding:.1vw 1vw;font-size:1.4vw}
.tvcard{background:#1F211D;border-radius:.8vw;padding:1vw 1.2vw;border-left:.5vw solid #7a1f2b}
.tvcard .a{display:flex;align-items:baseline;gap:1vw}
.tvcard .a b{font-size:2vw;font-family:var(--serif)}
.tvcard .a span{min-width:0;flex:1;font-size:1.6vw;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvcard .bdg{flex:none;margin-left:auto;font-size:1vw;background:#b3261e;border-radius:999px;padding:.15vw .8vw;font-weight:700;white-space:nowrap}
.tvcard .d{color:#B5B2A8;margin-top:.4vw;font-size:1.15vw}
.tvcard .ln{font-size:1.15vw;margin-top:.3vw;color:#E6E3DB}
.tvl{display:flex;align-items:center;gap:.8vw}.tvl small{color:#B5B2A8;font-size:1vw}.tvl .dot{width:1vw!important;height:1vw!important}
.btl{width:auto;flex:none;object-fit:contain}
.tvbar{height:.6vw;background:#2B2E28;border-radius:999px;overflow:hidden;margin-top:.6vw}
.tvbar i{display:block;height:100%;background:#6fcf8a}
.tvfoot{display:flex;gap:2vw;color:#B5B2A8;font-size:1.1vw;white-space:nowrap;overflow:hidden;border-top:1px solid #2B2E28;padding-top:1vh}
.tvfoot b{color:#F5F2EC;font-weight:600}
.tvempty{color:#6F7268;font-size:1.3vw;padding:1vw}
.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 .4vw #e2b33c;transform:scale(1.02)}100%{box-shadow:0 0 0 0 transparent;transform:none}}
body.tvmode #top{position:fixed;left:0;right:0;transform:translateY(-100%);transition:transform .3s}
body.tvmode.showtop #top{transform:none}

/* Modale / toast */
#modal{position:fixed;inset:0;background:rgba(30,15,10,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
#modal .mbox{background:var(--paper);border-radius:14px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#modal h3{font-size:21px;margin-bottom:10px}
#modal label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
#modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
#modal .grid2 input,#modal .grid2 select{width:100%}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--wine-d);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:60;font-size:14px;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header id="top">
  <div class="brand">
    <img class="brandlogo" src="img/logo.png" alt="Cherrier Frères" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'Cherrier Frères'}))">
    <div class="sep">Logistique des commandes<br><small>préversion d'essai</small></div>
  </div>
  <nav id="views">
    <button data-view="pres">Présentation</button>
    <button data-view="pc">Ordinateur</button>
    <button data-view="tab">Tablette</button>
    <button data-view="tv">TV</button>
  </nav>
  <div id="sync" class="wait" title="Synchronisation entre appareils"><i></i><span>Connexion…</span></div>
</header>
<main id="app"></main>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   Préversion d'essai — toutes les données sont fictives.
   Synchronisation entre appareils : chaque action est un petit "événement"
   publié sur un canal ntfy.sh ; chaque appareil rejoue les événements.
   ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

const DEV = lsGet("rossi-dev") || (() => { const d = uid().slice(-6); lsSet("rossi-dev", d); return d; })();
const params = new URLSearchParams(location.search);
const SALLE = ((params.get("salle") || "principale").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 24)) || "principale";
const TOPIC = "rossignole-pv-k7q2-" + SALLE;
const NTFY = "https://ntfy.sh/" + TOPIC;
const LSKEY = "rossi-ev-" + SALLE;
const LSOUT = "rossi-out-" + SALLE;

/* ---------- dates ---------- */
const isoD = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const plusJ = n => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return isoD(d); };
const TODAY = () => isoD(new Date());
const fmtD = s => { if (!s) return "—"; const [y, m, d] = s.split("-"); return new Date(+y, m - 1, +d).toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }); };
const fmtT = t => new Date(t).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const fmtDT = t => { const d = new Date(t); return (isoD(d) === TODAY() ? "Aujourd'hui" : d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" })) + " " + fmtT(t); };
const ago = m => Date.now() - m * 60000;

/* ---------- données de départ (fictives) ---------- */
const COUL = { blanc: "var(--blanc)", rouge: "var(--rouge)", rose: "var(--rose)" };
function SEED() {
  return {

let events = []; try { events = JSON.parse(lsGet(LSKEY) || "[]"); } catch (e) { events = []; }

const seen = new Set(events.map(e => e.id));
let S = SEED();

function rebuild() {
  events.sort((a, b) => a.t - b.t || (a.id < b.id ? -1 : 1));
  S = SEED();
  for (const e of events) { try { apply(S, e); } catch (err) { console.warn("évènement ignoré", e, err); } }
}
function persist() {
  let last = -1; events.forEach((e, i) => { if (e.type === "reset") last = i; });
  if (last > 0) { events = events.slice(last); }
  lsSet(LSKEY, JSON.stringify(events.slice(-1500)));
}
function ord(id) { return S.orders.find(o => o.id === id); }

const alloc = l => (l.alloc != null ? l.alloc : l.qte);

function apply(S, e) {
  const p = e.p || {}; const o = p.id ? S.orders.find(x => x.id === p.id) : null;
  const hist = (o, txt) => { if (o) { o.hist.push({ t: e.t, txt }); S.log.push({ t: e.t, txt: "N°" + o.num + " · " + txt }); } };
  switch (e.type) {
    case "reset": { const f = SEED(); for (const k of Object.keys(S)) delete S[k]; Object.assign(S, f); S.log.push({ t: e.t, txt: "Démo réinitialisée" }); break; }
    case "mail_new": S.mails.unshift(Object.assign({}, p.mail, { recu: e.t, lu: false, traite: false })); S.log.push({ t: e.t, txt: "Nouveau mail de " + cli(p.mail.client).nom }); break;
    case "mail_lu": { const m = S.mails.find(x => x.id === p.id); if (m) m.lu = true; break; }
    case "order_create": {
      const src = p.order;
      const o2 = mkOrder(src.id, S.nextNum++, src.client, "nouvelle", src.souhaitee || plusJ(5), e.t, (src.lignes || []).map(normLine), src.notes || "");
      o2.hist = []; S.orders.push(o2);
      hist(o2, src.mail ? "Commande créée depuis un mail" : "Commande saisie au bureau");
      if (src.mail) { const m = S.mails.find(x => x.id === src.mail); if (m) { m.traite = true; m.lu = true; m.order = o2.id; } }
      break;
    }
    case "order_patch": if (o) Object.assign(o, p.patch); if (o && p.txt) hist(o, p.txt); break;
    case "line_patch": if (o && o.lignes[p.i]) Object.assign(o.lignes[p.i], p.patch); break;
    case "line_add": if (o) o.lignes.push(normLine(p.line)); break;
    case "line_del": if (o) o.lignes.splice(p.i, 1); break;
    case "statut": if (o) {
      const from = o.statut; o.statut = p.statut;
      if (p.statut === "expediee" && from !== "expediee") o.lignes.forEach(l => { const c = S.cuvees.find(c => c.id === l.cuvee); if (c) c.stock = Math.max(0, c.stock - alloc(l)); });
      if (p.statut === "etiquetage" && from === "encours") { /* retour */ }
      hist(o, p.txt || ST[p.statut].lib);
    } break;
    case "stock": { const c = S.cuvees.find(x => x.id === p.id); if (c) Object.assign(c, p.patch); S.log.push({ t: e.t, txt: "Stock mis à jour : " + (c ? c.nom : "") }); break; }
    case "pb": if (o) { o.pb = p.txt ? { txt: p.txt, t: e.t } : null; hist(o, p.txt ? "Problème signalé au poste : " + p.txt : "Problème résolu"); } break;
    case "mailout": if (o) hist(o, "Mail préparé : " + p.kind); break;
  }
}

/* ---------- synchronisation ---------- */
function addEvents(list, fromRemote) {
  let added = false;
  for (const e of list) { if (!e || !e.id || !e.type || seen.has(e.id)) continue; seen.add(e.id); events.push(e); added = true; }
  if (added) {
    const before = snapshotKeys();
    rebuild(); persist();
    if (fromRemote) markChanges(before);
    render(!fromRemote);
  }
  return added;
}
function emit(type, p) {
  const e = { id: uid(), t: Date.now(), d: DEV, type, p };
  addEvents([e], false);
  outbox.push(e); lsSet(LSOUT, JSON.stringify(outbox)); flush();
  return e;
}
let flushing = false;
async function flush() {
  if (flushing || !outbox.length) return; flushing = true;
  try {
    while (outbox.length) {
      const e = outbox[0];
      const r = await fetch(NTFY, { method: "POST", body: JSON.stringify(e) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      outbox.shift(); lsSet(LSOUT, JSON.stringify(outbox));
    }
    setSync("ok");
  } catch (err) { setSync("off"); setTimeout(() => { flushing = false; flush(); }, 15000); return; }
  flushing = false;
}
let es = null;
function connect() {
  if (!("EventSource" in window)) { setSync("off"); return; }
  try {
    es = new EventSource(NTFY + "/sse?since=all");
    es.onopen = () => setSync("ok");
    es.onmessage = ev => { try { const m = JSON.parse(ev.data); if (m.event === "message") addEvents([JSON.parse(m.message)], true); } catch (e) {} };
    es.onerror = () => setSync(navigator.onLine ? "wait" : "off");
  } catch (e) { setSync("off"); }
  // Si le canal a été vidé (le service garde ~12 h), on republie ce que cet appareil connaît.
  fetch(NTFY + "/json?poll=1&since=all").then(r => r.ok ? r.text() : Promise.reject()).then(txt => {
    const ids = new Set();
    txt.split("\n").forEach(l => { try { const m = JSON.parse(l); if (m.event === "message") ids.add(JSON.parse(m.message).id); } catch (e) {} });
    const missing = events.filter(e => !ids.has(e.id) && !outbox.some(x => x.id === e.id) && e.t < Date.now() - 60000).slice(-60);
    if (missing.length && ids.size < events.length) { outbox = missing.concat(outbox); lsSet(LSOUT, JSON.stringify(outbox)); flush(); }
  }).catch(() => {});
}
function setSync(s) {
  const el = $("#sync"); if (!el) return;
  el.className = s;
  el.querySelector("span").textContent = s === "ok" ? "Synchro en direct" : s === "wait" ? "Reconnexion…" : "Hors ligne (local)";
  el.title = s === "ok" ? "Les actions apparaissent en direct sur les autres appareils (salle « " + SALLE + " »)" : "Les actions restent sur cet appareil et partiront dès que la connexion revient";
}
window.addEventListener("online", flush);

function snapshotKeys() { const m = {}; S.orders.forEach(o => m[o.id] = o.statut + "|" + o.lignes.map(l => +l.ce + +l.et + +l.ca + "/" + l.faits).join(",") + "|" + (o.pb ? 1 : 0)); return m; }
function markChanges(before) {
  const after = snapshotKeys(); flashIds = new Set();
  for (const k in after) if (before[k] !== after[k]) flashIds.add(k);
  if (flashIds.size) { toast(lastLog()); setTimeout(() => { flashIds = new Set(); }, 2600); }
}

/* ---------- calculs de stock ---------- */
function reserved(cid, exceptId) {
  let s = 0; for (const o of S.orders) { if (o.id === exceptId || !RESERVE_ST.includes(o.statut)) continue; for (const l of o.lignes) if (l.cuvee === cid) s += alloc(l); } return s;
}
function pendingNew(cid, exceptId) {
  let s = 0; for (const o of S.orders) { if (o.id === exceptId || o.statut !== "nouvelle") continue; for (const l of o.lignes) if (l.cuvee === cid) s += l.qte; } return s;
}
function verdict(o) {
  const c = cli(o.client); const out = {};
  const dem = {}; o.lignes.forEach(l => dem[l.cuvee] = (dem[l.cuvee] || 0) + l.qte);
  for (const cid in dem) {
    const cv = cuv(cid); const r = reserved(cid, o.id); const dispo = cv.stock - r; const libre = dispo - (c.hab ? 0 : cv.res);
    const level = dem[cid] <= libre ? "ok" : dem[cid] <= dispo ? "tendu" : "rupture";
    out[cid] = { demande: dem[cid], stock: cv.stock, reserve: r, dispo, libre, resHab: cv.res, attente: pendingNew(cid, o.id), level, max: Math.max(0, c.hab ? dispo : libre) };
  }
  return out;
}
function worst(v) { let w = "ok"; for (const k in v) { if (v[k].level === "rupture") return "rupture"; if (v[k].level === "tendu") w = "tendu"; } return w; }
const VLIB = { ok: "Disponible", tendu: "Tendu", rupture: "Insuffisant" };
function progress(o) { let tot = 0, done = 0; o.lignes.forEach(l => { tot += 3; done += (+l.ce) + (+l.et) + (+l.ca); }); return tot ? done / tot : 0; }
function totBt(o) { return o.lignes.reduce((s, l) => s + alloc(l), 0); }
function totCartons(o) { return o.lignes.reduce((s, l) => s + nbCartons(l), 0); }
function poids(o) { return Math.round(o.lignes.reduce((s, l) => s + alloc(l) * cuv(l.cuvee).kg + nbCartons(l) * 0.4, 0) + (o.palettes || 0) * 25); }

function orderPane(o) {

  const si = FLOW.indexOf(o.statut);
  const stepper = `<div class="stepper">${FLOW.map((s, i) => `<div class="${i < si ? "done" : i === si ? "cur" : ""}">${ST[s].court}</div>`).join("")}</div>`;
  const rows = o.lignes.map((l, i) => {

    return `<tr><td>${dot(l.cuvee)} ${cuvLib(l.cuvee)}</td><td>${esc(hab(l.hab).nom)}</td><td class="num">${l.qte}</td><td class="num">${l.carton}</td>
      <td>${edit ? `<span class="vchip ${vv.level}" title="Stock ${vv.stock} · réservé ${vv.reserve} · réserve habituels ${vv.resHab}">${VLIB[vv.level]} · ${Math.max(0, vv.dispo)} dispo</span>` : `<span class="muted">${nbCartons(l)} cartons</span>`}</td>

    ${Object.entries(v).filter(([, x]) => x.level !== "ok").map(([cid, x]) => `<div style="font-size:13.5px;margin:4px 0">${dot(cid)} <b>${cuvLib(cid)}</b> : demandé ${x.demande} · stock nu ${x.stock} · déjà réservé ${x.reserve} · réserve habituels ${x.resHab}${x.attente ? ` · ${x.attente} demandés dans d'autres nouvelles commandes` : ""} → <b>${x.max} possibles</b> pour ce client</div>`).join("")}
    <div class="row" style="margin-top:8px"><button class="btn s" data-act="maxalloc" data-id="${o.id}">Accorder le maximum possible</button><span class="muted" style="font-size:12.5px">Vous gardez la main : modifiez la colonne « Accordé » si besoin.</span></div>
  </div>` : "";
  const addRow = o.statut === "nouvelle" ? `<tr><td><select data-ch="add" data-f="cuvee">${S.cuvees.map(x => `<option value="${x.id}" ${ui.add.cuvee === x.id ? "selected" : ""}>${esc(x.nom)} ${x.mill}</option>`).join("")}</select></td>
    <td><select data-ch="add" data-f="hab">${S.habs.map(x => `<option value="${x.id}" ${ui.add.hab === x.id ? "selected" : ""}>${esc(x.nom)}</option>`).join("")}</select></td>
    <td class="num"><input type="number" min="1" value="${ui.add.qte}" data-ch="add" data-f="qte" style="width:70px"></td>

    <td colspan="3"><button class="btn s" data-act="addline" data-id="${o.id}">+ Ajouter la ligne</button></td></tr>` : "";

  let act = "";

    case "etiquetage": case "encours": act = `<div style="flex:1;min-width:220px"><div class="row" style="font-size:13.5px"><span>Au poste d'étiquetage (tablette)</span><span class="sp"></span><b>${Math.round(progress(o) * 100)} %</b></div><div class="bar" style="margin-top:6px"><i style="width:${progress(o) * 100}%"></i></div></div><button class="btn" data-act="st" data-id="${o.id}" data-v="attente" data-txt="Reprise au bureau">Reprendre au bureau</button>`; break;

function pcStock() {

/* ===== Modale, toast, copie ===== */
function modal(html) { $("#mbox").innerHTML = html; $("#modal").classList.add("on"); }
function closeModal() { $("#modal").classList.remove("on"); }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
let toastT; function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 2600); }
function copy(t) {
  const done = () => toast("Copié dans le presse-papiers");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done)); else fallbackCopy(t, done);
}
function fallbackCopy(t, done) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} ta.remove(); }

function mailModal(title, to, subject, body, confirmLabel, onConfirm) {

    <label>À</label><input type="text" value="${esc(to)}" readonly style="width:100%">

    <div class="actions"><button class="btn" data-act="mcopy">Copier le texte</button><a class="btn" id="mMailto" href="#" target="_blank" rel="noopener">Ouvrir dans la messagerie</a><span class="sp"></span><button class="btn" data-act="mclose">Fermer</button><button class="btn p" data-act="mok">${esc(confirmLabel)}</button></div>`);
  const upd = () => { $("#mMailto").href = "mailto:" + encodeURIComponent(to) + "?subject=" + encodeURIComponent($("#mSubj").value) + "&body=" + encodeURIComponent($("#mBody").value); };
  upd(); $("#mSubj").oninput = upd; $("#mBody").oninput = upd;
  modalOk = onConfirm;
}
let modalOk = null;
const SIGN = "\n\nBien cordialement,\nCherrier Frères — Domaine de la Rossignole\nSancerre · Menetou-Salon";
function lignesTxt(o, withDispo) {
  return o.lignes.map(l => { const a = alloc(l); const base = `- ${cuv(l.cuvee).nom} ${cuv(l.cuvee).mill} (${hab(l.hab).nom}) : `;

    return base + (a >= l.qte ? `${l.qte} bouteilles — disponible` : a === 0 ? `${l.qte} demandées — malheureusement plus disponible pour le moment` : `${l.qte} demandées — ${a} bouteilles disponibles`); }).join("\n");
}

/* ===== Actions ===== */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-view]"); if (!b) return;
  if (b.dataset.view) { setView(b.dataset.view); return; }
  const act = b.dataset.act, id = b.dataset.id, i = +b.dataset.i, v = b.dataset.v;

  switch (act) {

    case "mail": ui.mail = id; { const m = S.mails.find(x => x.id === id); if (m && !m.lu) emit("mail_lu", { id }); else render(true); } break;

    case "neworder": newOrderModal(); break;
    case "delline": emit("line_del", { id, i }); break;

      o.lignes.forEach((l, j) => { const a = Math.min(l.qte, Math.max(0, left[l.cuvee])); const ar = Math.floor(a / l.carton) * l.carton || a; left[l.cuvee] -= ar; if (ar !== alloc(l)) emit("line_patch", { id, i: j, patch: { alloc: ar } }); });
      emit("order_patch", { id, patch: {}, txt: "Arbitrage : quantités accordées ajustées au disponible" }); break; }

    case "pbok": emit("pb", { id, txt: null }); break;

  }

  const id = el.dataset.id;
  switch (ch) {
    case "alloc": { const o = ord(id); const i = +el.dataset.i; const val = Math.max(0, Math.min(o.lignes[i].qte, Math.round(+el.value || 0))); emit("line_patch", { id, i, patch: { alloc: val } }); break; }
    case "souhaitee": emit("order_patch", { id, patch: { souhaitee: el.value }, txt: "Date souhaitée : " + fmtD(el.value) }); break;
    case "notes": emit("order_patch", { id, patch: { notes: el.value }, txt: "Consignes modifiées" }); break;
    case "stock": { const val = Math.max(0, Math.round(+el.value || 0)); emit("stock", { id, patch: { [el.dataset.f]: val } }); break; }
    case "add": ui.add[el.dataset.f] = el.value; if (el.dataset.f === "carton" || el.dataset.f === "qte") ui.add[el.dataset.f] = +el.value; break;
  }
});

function enlModal(o) {
  const c = cli(o.client); const e0 = o.enl || {}; const colis = o.colis || totCartons(o);
  const txt = () => `Bonjour,\n\nNous avons une expédition prête chez Cherrier Frères (Domaine de la Rossignole) :\n\n- Commande : n°${o.num}\n- Destinataire : ${c.nom}, ${c.ville}\n- Colis : ${colis} cartons${o.palettes ? `, sur ${o.palettes} palette(s)` : ""}\n- Poids estimé : ${poids(o)} kg\n- Enlèvement souhaité : ${fmtD($("#eDate") ? $("#eDate").value : e0.date || plusJ(1))}\n\nMerci de nous confirmer le passage.` + SIGN;
  modal(`<h3>Enlèvement — commande n°${o.num}</h3>
    <div class="grid2">
      <div><label>Transporteur</label><select id="eTr">${S.transp.map(t => `<option ${e0.tr === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></div>
      <div><label>Date d'enlèvement</label><input type="date" id="eDate" value="${e0.date || plusJ(1)}"></div>
      <div><label>Référence de réservation</label><input type="text" id="eRef" value="${esc(e0.ref || "")}" placeholder="donnée par le site du transporteur"></div>
      <div><label>Colis · palettes · poids</label><input type="text" value="${colis} colis · ${o.palettes || 0} pal. · ~${poids(o)} kg" readonly></div>
    </div>
    <label>Message de confirmation pour le transporteur</label><textarea id="tBody" rows="9">${esc(txt())}</textarea>
    <p class="muted" style="font-size:12.5px">La réservation se fait toujours sur le site du transporteur. Notez ici la référence obtenue pour garder la trace.</p>
    <div class="actions"><button class="btn" data-act="tcopy">Copier le message</button><span class="sp"></span><button class="btn" data-act="mclose">Fermer</button><button class="btn p" data-act="mok">Enregistrer l'enlèvement</button></div>`);
  $("#eDate").onchange = () => { $("#tBody").value = txt(); };
  modalOk = () => { const enl = { tr: $("#eTr").value, date: $("#eDate").value, ref: $("#eRef").value.trim() };
    emit("order_patch", { id: o.id, patch: { enl, colis }, txt: `Enlèvement : ${enl.tr.split(" — ")[0]} le ${fmtD(enl.date)}${enl.ref ? " (réf. " + enl.ref + ")" : ""}` });
    if (o.statut === "prete") emit("statut", { id: o.id, statut: "enlevement", txt: "Enlèvement réservé" }); };
}
function newOrderModal() {
  modal(`<h3>Saisir une commande (reçue par téléphone, sur un salon…)</h3>
    <div class="grid2"><div><label>Client</label><select id="nCli">${S.clients.map(c => `<option value="${c.id}">${esc(c.nom)} — ${esc(c.ville)}</option>`).join("")}</select></div>
    <div><label>Pour le</label><input type="date" id="nDate" value="${plusJ(5)}"></div></div>
    <p class="muted" style="font-size:13px">Vous ajouterez les lignes de commande juste après.</p>
    <div class="actions"><span class="sp"></span><button class="btn" data-act="mclose">Annuler</button><button class="btn p" data-act="mok">Créer</button></div>`);
  modalOk = () => { const oid = "o" + uid(); emit("order_create", { order: { id: oid, client: $("#nCli").value, souhaitee: $("#nDate").value, lignes: [] } }); ui.pcTab = "cmd"; ui.filtre = "actives"; ui.order = oid; render(true); };
}

/* ---------- mails simulés ---------- */
function genMail() {
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const k = pick(S.clients);
  const n = 1 + Math.floor(Math.random() * 3);
  const cuvs = S.cuvees.slice().sort(() => Math.random() - .5).slice(0, n);
  const habFor = { k1: "h3", k2: "h4", k3: "h5", k5: "h2" };
  const lignes = cuvs.map(c => { const carton = k.pro ? pick([6, 12, 12]) : 6; const qte = carton * (k.pro ? pick([2, 4, 5, 10, 20]) : pick([1, 2])); return { cuvee: c.id, hab: habFor[k.id] || "h1", qte, carton }; });
  const j = 3 + Math.floor(Math.random() * 8);
  const intro = pick(["Bonjour,\n\nPouvez-vous nous préparer :", "Bonjour,\n\nJe souhaiterais commander :", "Bonjour,\n\nVoici notre commande :", "Bonjour,\n\nPour notre prochain réassort, il nous faudrait :"]);
  const corps = `${intro}\n${lignes.map(l => `- ${l.qte} bouteilles de ${cuv(l.cuvee).nom} ${cuv(l.cuvee).mill} (cartons de ${l.carton})`).join("\n")}\n\nIdéalement pour le ${fmtD(plusJ(j))}.\n\nMerci d'avance,\n${k.nom}`;
  return { id: "m" + uid(), client: k.id, sujet: pick(["Commande", "Nouvelle commande", "Réassort", "Demande de disponibilité"]) + " — " + k.nom, corps, lignes, souhaitee: plusJ(j) };
}

/* ---------- démarrage ---------- */
rebuild();
render(true);
setSync("wait");
connect();
flush();
setInterval(() => { if (!pendingRender && ui.view !== "pc") render(); }, 60000);
</script>
</body>
